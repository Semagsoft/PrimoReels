name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            ffmpeg desktop-file-utils

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: qtmultimedia
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Validate desktop entry
        run: desktop-file-validate packaging/io.github.primoreels.desktop

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: dummy
        run: ctest --test-dir build --output-on-failure -j2

      - name: Install check
        run: |
          cmake --install build --prefix /tmp/stage
          test -x /tmp/stage/bin/PrimoReels
          test -f /tmp/stage/share/applications/io.github.primoreels.desktop
          test -f /tmp/stage/share/metainfo/io.github.primoreels.metainfo.xml
          test -f /tmp/stage/share/icons/hicolor/scalable/apps/io.github.primoreels.svg
          grep -q "launchable.*io.github.primoreels.desktop" packaging/io.github.primoreels.metainfo.xml

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs
          path: build/Testing/Temporary/LastTest.log

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-lint-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt (for qmllint)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: qtmultimedia
          cache: true

      - name: QML lint
        run: |
          qmllint qml/Main.qml qml/TimelineView.qml qml/MonitorView.qml \
            qml/LibraryView.qml qml/SourceMonitorView.qml qml/InspectorView.qml

      - name: Install clang tools
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update
          sudo apt-get install -y clang-22 clang-format-22 clang-tidy-22

      - name: C++ format check
        run: clang-format-22 --dry-run --Werror src/*.cpp src/*.h tests/*.cpp

      - name: Install FFmpeg dev packages
        run: |
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev

      - name: Configure (clang++, compile commands)
        run: cmake -S . -B build-tidy -DCMAKE_CXX_COMPILER=clang++-22 -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Generate AUTOGEN outputs (for clang-tidy)
        run: >
          cmake --build build-tidy --target
          PrimoReelsLib_autogen PrimoReels_autogen
          PrimoReelsTests_autogen ExportTests_autogen
          EffectTests_autogen QmlLoadTests_autogen

      - name: clang-tidy
        run: |
          find src tests -name '*.cpp' | xargs clang-tidy-22 -p build-tidy --quiet

      - name: Validate packaging metadata
        run: |
          sudo apt-get install -y appstream desktop-file-utils
          desktop-file-validate packaging/io.github.primoreels.desktop
          appstreamcli validate --no-net packaging/io.github.primoreels.metainfo.xml

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-sanitize-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            ffmpeg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: qtmultimedia
          cache: true

      - name: Configure with sanitizers
        run: >
          cmake -S . -B build-san
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-san --parallel

      - name: Test under sanitizers
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: dummy
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure -j2

  tsan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-tsan-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            ffmpeg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.2"
          modules: qtmultimedia
          cache: true

      - name: Configure with ThreadSanitizer
        run: >
          cmake -S . -B build-tsan
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
          -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
          -DPRIMOREELS_TESTS_ISOLATE_FUNCTIONS=ON

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test under ThreadSanitizer
        env:
          QT_QPA_PLATFORM: offscreen
          QT_MEDIA_BACKEND: dummy
          # System Qt is not TSan-instrumented, so Qt-internal races
          # (QDBusConnection, sendPostedEvents, ...) are expected noise.
          # halt_on_error=0 lets a test finish on the expected noise;
          # exitcode=0 stops TSan's default 66 from failing ctest, so the
          # checks below are the only gate. NOTE: exitcode=0 also masks
          # fatal TSan errors (THREAD REGISTRY CHECK failed, ...) — the
          # PASS_REGULAR_EXPRESSION "Totals:" on every test (see
          # primoreels_add_test in CMakeLists.txt) turns a mid-suite death
          # into a ctest failure instead.
          TSAN_OPTIONS: halt_on_error=0:exitcode=0:second_deadlock_stack=1
        # Serial run: keeps each TSan report contiguous in tsan.log so a
        # report can be attributed to one test when triaging the artifact.
        run: ctest --test-dir build-tsan --verbose -j1 2>&1 | tee tsan.log

      - name: Fail on TSan runtime failure
        run: |
          if grep -qE "FATAL: ThreadSanitizer|CHECK failed:" tsan.log; then
            echo "ThreadSanitizer runtime failed (see tsan.log)"; exit 1
          fi

      # NOTE: there is deliberately no name-grep gate for races here. Every
      # PrimoReels frame that can appear in a report also appears in the
      # platform noise, so no name rule can be both green and meaningful:
      #  - Qt-internal races (QDBusConnection, gdbus, glib, pango, ...) name
      #    test functions in allocator/creation stacks;
      #  - Qt's TSan mutex wrapper (qtsan_impl.h) reports spurious
      #    "double lock of a mutex" on every engine QMutex plus companion
      #    "data race" reports whose SUMMARY is rooted in
      #    DecoderThread/PreloadThread/ExportThread entry points — each
      #    flagged pair verified guarded by the same m_mutex on both sides;
      #  - worker-teardown reports (dtor vs finished run()) fire although
      #    every worker is provably joined (stopAndWait) before its members
      #    die: the same thread-registry corruption behind the CHECK above
      #    loses TSan's join edges.
      # Race triage is manual from the uploaded tsan.log artifact.

      - name: Upload TSan log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsan-log
          path: tsan.log
